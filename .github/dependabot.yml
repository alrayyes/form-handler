# Dependabot raises the pull request; CI decides whether it lands. Everything
# here is pinned to an exact version, which is the whole reason this works —
# a floating range drifts silently and there is nothing to raise a pull request
# about.
#
# Two pins Dependabot cannot see, and which are updated by hand: the distroless
# base image in .ko.yaml, and the Mailpit image the integration test uses. Both
# are digest-pinned and neither lives anywhere Dependabot's ecosystems look.
# The gitleaks image is tracked through the stub Dockerfile in .github/gitleaks/,
# which gitleaks.yml builds; image-pins.yml still checks its digest.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    commit-message:
      # Conventional Commits, because commitlint checks these messages and the
      # version number is computed from them. gomod ships in the built binary,
      # so a bump here is a change to what ships whether or not it's
      # security-relevant, and fix: cuts the patch release the same way any
      # other fix does. github-actions below stays ci: — it changes the
      # pipeline, not the artifact.
      prefix: fix
      include: scope
    groups:
      # One pull request rather than thirty. The testcontainers tree alone
      # pulls in most of Docker's Go packages as indirect dependencies.
      go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Nothing here is JavaScript. package.json exists so commitlint can resolve
  # the shared config it extends, which bunx alone cannot do.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: chore
      include: scope
    groups:
      tooling:
        patterns: ["*"]
        update-types: [minor, patch]

  # The stub Dockerfile that pins gitleaks for .github/workflows/gitleaks.yml.
  # Dependabot doesn't read a workflow's `container:`, so the pin lives here.
  # ci: because it changes the pipeline, not what ships.
  - package-ecosystem: docker
    directory: /.github/gitleaks
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
      include: scope
    # A group, even of one, keeps a bump on Dependabot's lowercase group-title
    # template instead of the sentence-case single-update one, which fails
    # commitlint's subject-case rule.
    groups:
      gitleaks:
        patterns: ["*"]
        update-types: [minor, patch]
      gitleaks-major:
        patterns: ["*"]
        update-types: [major]
