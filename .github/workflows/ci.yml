# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [master]
  pull_request:

# Least privilege by default. A job that needs more says so itself.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same version the pre-commit hook runs. When these two disagree the hook
  # passes and the pipeline fails, and the reason is not obvious from the failure.
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # The integration and container tests are behind build tags, so
          # without this they are invisible to the linter — which is how three
          # findings sat in the integration test unnoticed. They are the tests
          # that matter most; they should be held to the same standard as what
          # they test.
          args: --build-tags=integration,containertest
      - name: gofmt
        # golangci-lint's formatter reports rather than rewrites here; this is
        # the check that a file was committed unformatted.
        run: gofmt -l . | (! grep .)

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Report coverage
        run: |
          go tool cover -func=coverage.out | tail -1 |
            awk '{ print "**Coverage: " $3 "**" }' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        # GitHub withholds repo secrets from Dependabot-triggered runs, so
        # CODECOV_TOKEN is empty here — exposing it as a Dependabot secret
        # instead would hand a compromised dependency a way to exfiltrate it
        # during this same `go test`. Skip the upload rather than fail the
        # job on a token this run was never going to have.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          # Defaults to false, which means a broken upload has never once
          # turned this job red. Worth enforcing now that CODECOV_TOKEN backs
          # it instead of the tokenless fallback.
          fail_ci_if_error: true

  # The outer test, and the one to trust. It posts real requests at the real
  # composition root and asserts real messages arrived in the right inboxes.
  integration:
    runs-on: ubuntu-24.04
    services:
      mailpit:
        # testcontainers would start this itself, but it needs a Docker daemon
        # inside the job to do it. Running Mailpit as an ordinary service
        # container and pointing the test at it needs no daemon and asserts
        # exactly the same things — see startMailpit for the long version.
        image: axllent/mailpit:v1.21.8@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
        ports:
          - 1025:1025
          - 8025:8025
      # A second one, because the test that proves each form sends through its
      # own server needs two servers to tell apart. One would pass whether or
      # not the per-form SMTP settings were being used at all.
      mailpit2:
        image: axllent/mailpit:v1.21.8@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
        ports:
          - 1026:1025
          - 8026:8025
    env:
      MAILPIT_SMTP_ADDR: 127.0.0.1:1025
      MAILPIT_API_URL: http://127.0.0.1:8025
      MAILPIT_SMTP_ADDR_2: 127.0.0.1:1026
      MAILPIT_API_URL_2: http://127.0.0.1:8026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Wait for Mailpit
        # The service container is started before the job, but "started" is not
        # "listening". Without this the first test races it and fails on an
        # empty mailbox that was never reachable.
        run: |
          for url in "$MAILPIT_API_URL" "$MAILPIT_API_URL_2"; do
            up=""
            for _ in $(seq 1 30); do
              if curl -fsS "$url/api/v1/messages" >/dev/null 2>&1; then
                up=yes; break
              fi
              sleep 1
            done
            if [ -z "$up" ]; then
              echo "Mailpit at $url never came up"; exit 1
            fi
            echo "Mailpit at $url is up"
          done
      - name: go test -tags=integration
        run: go test -race -tags=integration ./...

  # Layout first, then structure. Prettier decides what the Markdown looks like
  # and markdownlint judges what Prettier produced; the other order has
  # markdownlint fixing something Prettier is about to overwrite.
  prose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        # Frozen, so a drifted lockfile fails the job rather than silently
        # resolving to something nobody committed.
        run: bun install --frozen-lockfile
      - name: prettier --check
        # YAML as well as Markdown. Every workflow, every config: it is the
        # other format Biome does not take, and this job is where it lands.
        # The glob lives in package.json so the pre-push hook runs this exact
        # command, rather than a copy of it that can drift.
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # Biome takes every file type it supports, which in a Go repository is the
  # JSON: the tooling manifests, the linter configs, and what release-please
  # keeps the version in. Small, and exactly the sort of file a bad edit breaks
  # silently until the tool that reads it next runs.
  json:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: biome
        # Literally the same command the pre-push hook runs, not a copy of it.
        # `check` is format and lint together, reporting rather than writing.
        run: bun run lint:json

  # The API description is a contract, and this is the half of checking it that
  # the Go tests cannot do. `go test` proves the spec matches what the handler
  # answers; this proves the document is valid OpenAPI while it does, so a spec
  # that drifts into something no generator or client can read fails here
  # rather than in whatever consumes it next.
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: redocly lint
        # The same script the pre-push hook runs. The extra flag only moves the
        # findings from a codeframe nobody scrolls to into annotations on the
        # diff; what gets linted is the `apis` list in redocly.yaml either way.
        run: bun run lint:api -- --format=github-actions

  # A hook is something you can skip, and the version number depends on these
  # messages being right, so the whole branch is checked here as well.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  # Proves the image still builds before anyone merges, without publishing
  # anything. The release workflow builds it the same way and does push.
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1
      - name: ko build
        env:
          KO_DOCKER_REPO: ko.local
          VERSION: ci
        run: ko build --bare --push=false ./cmd/form-handler

  # Runs the image this job builds, not the code that builds it: starts the
  # container, posts a real request, and checks --healthcheck against the
  # actual binary. The runner already has a Docker daemon on the host — the
  # same one the integration job's `services:` containers use — so this needs
  # no privileged sidecar or socket mount, unlike testcontainers running the
  # nested daemon a job container would need.
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1
      - name: go test -tags=containertest
        run: go test -race -tags=containertest ./...
