# Static analysis for the classes of bug a linter does not look for — tainted
# input reaching somewhere it should not, mostly, which is the shape of every
# interesting bug a public form endpoint has.
name: codeql

on:
  push:
    # master only. This is the run that keeps the baseline the pull request
    # analyses are compared against.
    branches: [master]
  # Every pull request, whatever it is based on. GitHub's starter workflow
  # filters this to the default branch, which is right until two pull requests
  # are stacked: the child is based on its parent, codeql never fires, and
  # because codeql is a required check the child then waits forever for a run
  # that is not coming. Retargeting it when the parent merges does not help —
  # that arrives as an `edited` event, which is not one of the three types a
  # pull_request trigger listens for by default.
  #
  # The cost of dropping the filter is one analysis per stacked pull request,
  # about two minutes. The cost of keeping it was a merge nobody could make.
  pull_request:
  schedule:
    # Weekly, because the queries improve even when the code does not.
    - cron: "27 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          languages: go
          # The extra queries are the point: the default set alone is close to
          # what golangci-lint already reports.
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
      - uses: github/codeql-action/analyze@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          category: /language:go
