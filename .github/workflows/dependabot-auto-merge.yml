# Turns Dependabot's pull requests on and lets CI decide. Nothing is merged
# here directly: this asks GitHub to merge the pull request once every required
# check is green, and the branch ruleset on master is what makes that a real
# condition rather than a polite request. A red pipeline leaves it sitting open.
name: dependabot auto-merge

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  auto-merge:
    # pull_request_target runs with a write-capable token against the base
    # branch, so it must never check out or run the pull request's code. It does
    # not: every step below talks to the API and nothing else.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch the update's metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          echo "Update type: $UPDATE_TYPE"
          # Squash, so a bump that took three pushes to go green still lands as
          # one commit whose message commitlint has already approved.
          gh pr merge --auto --squash "$PR_URL"
