# Watches the images this repository pins by digest and says so when one moves.
#
# Dependabot cannot see these. Its docker ecosystem reads Dockerfiles and
# Kubernetes manifests, and there is no Dockerfile here — ko assembles the image
# itself, and the test's mail server is pinned in a Go constant. So the base
# image, the one a CVE fix would land in, had nothing watching it at all.
#
# It opens an issue rather than a pull request on purpose. A pull request raised
# with GITHUB_TOKEN does not start the workflows whose checks the ruleset
# requires, so it would sit there unmergeable — and a bot bumping the base image
# unattended is a bigger decision than a bot pointing at it and saying "this
# moved". Updating the digest is a two-line edit; noticing it moved was the part
# nobody was doing.
name: image pins

on:
  schedule:
    # Mondays, alongside the Dependabot run, so all the dependency noise arrives
    # at once rather than trickling through the week.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # Also on changes to the pins themselves or to this check, so a bad digest is
  # caught when it lands rather than up to a week later.
  push:
    branches: [master]
    paths:
      - ".ko.yaml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/image-pins.yml"
      - ".github/scripts/check-image-pins.sh"
      - "**/*_test.go"

permissions:
  contents: read

concurrency:
  group: image-pins
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the pinned digests
        id: check
        run: |
          set +e
          ./.github/scripts/check-image-pins.sh > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # A registry that cannot be reached is not the same as a pin that has
      # moved, and reporting it as one would train everybody to ignore the
      # issue this opens.
      - name: Fail if a digest could not be resolved
        if: steps.check.outputs.status == '2'
        run: |
          cat report.md
          echo "::error::a pinned image could not be resolved — see the summary"
          exit 1

      - name: Open or update the issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "A pinned image digest has moved"
        run: |
          set -euo pipefail
          {
            echo "One of the digests this repository pins no longer matches the tag it was taken from."
            echo
            cat report.md
            echo
            echo "Updating it is a copy and paste into the files listed above. Worth reading the"
            echo "upstream release notes first — this is the base image the service ships on."
            echo
            echo "_Raised by [\`image-pins\`](../actions/workflows/image-pins.yml), run ${{ github.run_id }}._"
          } > body.md

          existing=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          if [ -n "$existing" ]; then
            # One issue that stays current, rather than a new one every Monday.
            gh issue comment "$existing" --body-file body.md
            echo "Updated issue #$existing" >> "$GITHUB_STEP_SUMMARY"
          else
            # Made here rather than assumed to exist. A label somebody set up by
            # hand once is not something the report should depend on: while it
            # was missing, `gh issue create --label` exited 1 *after* the check
            # had already found the drift, so the run went red saying "image
            # pins failed" and what it found went nowhere. --force makes this
            # idempotent, so a fork reports the same as this repo does.
            gh label create dependencies \
              --description "A pinned dependency needs a look" \
              --color 0366d6 --force
            gh issue create --title "$TITLE" --body-file body.md --label dependencies
          fi

      - name: Close the issue when everything matches again
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "A pinned image digest has moved"
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Every pinned digest matches its tag again."
          fi
