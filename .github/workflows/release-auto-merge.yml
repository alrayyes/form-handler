# release-please keeps its release pull request open and up to date, but
# somebody still has to merge it to cut the release. This asks GitHub to do
# that once every required check is green, the same way dependabot-auto-merge
# does for a dependency bump - nothing is merged here directly, and a red
# pipeline leaves the release pull request sitting open same as always.
#
# pull_request, not pull_request_target: this PR's branch lives on the repo
# itself, never a fork, so there's no untrusted checkout to guard against,
# and pull_request_target would trade away the elevated GITHUB_TOKEN
# permissions GitHub grants a bot-actor'd pull_request event for nothing.
# The previous pull_request_target version also proved unreliable in
# practice - one successful run ever, then zero runs at all (not even
# skipped) for the next release PR, which sat until merged by hand
# (#114).
name: release auto-merge

on: pull_request

jobs:
  auto-merge:
    # release-please labels its own pull request "autorelease: pending" and
    # re-labels it "autorelease: tagged" once merged - checking the label
    # rather than the actor and branch, since it doesn't care which
    # identity or branch name opened the PR at all.
    if: "contains(github.event.pull_request.labels.*.name, 'autorelease: pending')"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Squash, matching how every release pull request before this one
          # was merged by hand - the pull request already carries one commit,
          # so this changes who clicks the button, not the shape of history.
          gh pr merge --auto --squash "$PR_URL"
