# Nobody picks a version. release-please reads the Conventional Commits that
# land on master and keeps a release pull request open carrying the next version
# and the changelog entry; merging that pull request tags the release and writes
# the notes. goreleaser then hangs the artefacts on the release already sitting
# there, and ko pushes the image.
#
# One workflow rather than two, because a tag pushed with GITHUB_TOKEN starts no
# further workflow run — GitHub refuses, to stop recursive runs. A separate
# on-tag workflow would silently never fire, and the first symptom is a release
# with no binaries on it.
name: release

on:
  push:
    branches: [master]

permissions:
  contents: read

# Never two releases at once, and never cancel one halfway: a killed run can
# leave a tag pushed and nothing published against it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Works out what, if anything, is being released. Most runs only refresh the
  # release pull request; the run that matters is the one where that pull
  # request was what just landed.
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # tags the release and writes it
      pull-requests: write # keeps the release pull request up to date
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artefacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # attaches the binaries to the release
      packages: write # pushes the image to ghcr.io
      id-token: write # signs the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag, not the branch: goreleaser takes the version from the ref
          # it is standing on, and needs the history to build from.
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Artefacts only. The release and its notes already exist, and goreleaser
      # is configured to leave both alone.
      - name: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1

      # There is no Dockerfile. ko compiles the binary and assembles the layers
      # itself over the registry API, from what .ko.yaml says — the same
      # distroless base, pinned to the same digest, without a daemon.
      - name: Build and push the image
        id: ko
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.release-please.outputs.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ko login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "$GITHUB_TOKEN"

          # --bare puts the image at KO_DOCKER_REPO exactly, rather than under a
          # path derived from the Go import path. The ref goes to a file rather
          # than being read off stdout, which ko also writes progress to.
          ko build --bare \
            --platform=linux/amd64,linux/arm64 \
            --tags="${VERSION#v}","$VERSION",latest \
            --image-refs=image-refs.txt \
            ./cmd/form-handler

          REF=$(head -1 image-refs.txt)
          echo "digest=${REF##*@}" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$REF\`" >> "$GITHUB_STEP_SUMMARY"

      # What built this image, from which commit, provable without trusting the
      # summary above.
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.ko.outputs.digest }}
          push-to-registry: true

      - name: Attest the binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
