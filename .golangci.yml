version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - dupl
    - err113
    - errorlint
    - gocritic
    - gosec
    - makezero
    - misspell
    - modernize
    - nlreturn
    - revive
    - sqlclosecheck
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    gocritic:
      enabled-checks:
        - emptyStringTest
    gosec:
      excludes:
        # The SMTP address comes from configuration this service owns, not from
        # a request, and the bridge it talks to may legitimately be plaintext.
        - G402
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - dupl

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
