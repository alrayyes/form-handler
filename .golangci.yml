version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - dupl
    - err113
    - errorlint
    - funlen
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - makezero
    - misspell
    - modernize
    - nlreturn
    - nolintlint
    - perfsprint
    - revive
    - sqlclosecheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
    - wrapcheck
  settings:
    gocognit:
      min-complexity: 15
    gocritic:
      enabled-checks:
        - emptyStringTest
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        # The SMTP address comes from configuration this service owns, not from
        # a request, and the bridge it talks to may legitimately be plaintext.
        - G402
    nolintlint:
      require-explanation: true
      require-specific: true
    testifylint:
      enable-all: true
    wrapcheck:
      extra-ignore-sigs:
        # contact.Undeliverable already wraps err in a *DeliveryError with its
        # own Unwrap, same reason wrapcheck's own defaults skip errors.New(
        # and .Errorf( — this is this project's version of the same thing.
        - .Undeliverable(
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - dupl

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
