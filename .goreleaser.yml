version: 2

project_name: form-handler

before:
  hooks:
    - go mod download

builds:
  - main: ./cmd/form-handler
    env:
      - CGO_ENABLED=0
    # Only what this actually runs on. The service lives in a container on a
    # Linux VPS; cross-compiling for macOS would be building something nobody
    # will ever download.
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # The version the binary reports comes from the tag, so a running container
    # can be asked what it is without going back to CI to look it up.
    #
    # .Tag rather than .Version: .Version has the leading v stripped, and ko
    # stamps the image with the tag as-is. Two artefacts of the same release
    # answering "v1.2.3" and "1.2.3" is fine for a person and a trap for a
    # script comparing against a release tag.
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  # No commit hash in front of every line. goreleaser's default template puts
  # the full 40-character SHA there, which pushes the message — the only part
  # anybody reads a changelog for — off to the right and makes the file
  # unreadable at a glance. The release page links each entry to its commit
  # anyway, and `git log` is where you go when you want the hash.
  abbrev: -1
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Everything else
      order: 99
  filters:
    exclude:
      # The release job's own commit, and the housekeeping nobody reads release
      # notes to find out about.
      - '^chore\(release\):'
      - '^test:'
      - '^style:'
      # Both spellings of a merge. "Merge branch" was excluded and "Merge pull
      # request" was not, so every release listed the merge commit that carried
      # the change directly above the change itself.
      - '^Merge branch'
      - '^Merge pull request'

release:
  # Notes come from the changelog section above rather than from whatever the
  # tag message happened to say.
  mode: replace
