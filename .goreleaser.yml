version: 2

project_name: form-handler

before:
  hooks:
    - go mod download

builds:
  - main: ./cmd/form-handler
    env:
      - CGO_ENABLED=0
    # Only what this actually runs on. The service lives in a container on a
    # Linux VPS; cross-compiling for macOS would be building something nobody
    # will ever download.
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # The version the binary reports comes from the tag, so a running container
    # can be asked what it is without going back to CI to look it up.
    #
    # .Tag rather than .Version: .Version has the leading v stripped, and ko
    # stamps the image with the tag as-is. Two artefacts of the same release
    # answering "v1.2.3" and "1.2.3" is fine for a person and a trap for a
    # script comparing against a release tag.
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# release-please already wrote the notes, curated from the same commits, and
# created the release carrying them. A second shortlog generated here would put
# them on twice, and `release.mode: replace` would throw the curated copy away —
# so the changelog is off and `release.mode` stays at its default,
# keep-existing. goreleaser is only hanging binaries on a release that exists.
changelog:
  disable: true
