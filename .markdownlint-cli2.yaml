# Markdown this repo owns. There is not much of it, but the README is the first
# thing anyone reads and a broken link or a heading level skipped is exactly the
# sort of thing nobody notices while writing it.
globs:
  - "**/*.md"

# markdownlint's own style file for the rules Prettier already decides —
# heading style, blanks around headings and lists, fence style, trailing
# spaces and the rest. Drops MD013, re-enabled below under its alias.
extends: "markdownlint/style/prettier"

ignores:
  - CHANGELOG.md # written by the release job, not by hand
  # The Contributor Covenant, verbatim. Vendored prose belongs to whoever wrote
  # it — rewrapping it to satisfy a line length here would be editing somebody
  # else's document and would make the diff against upstream useless.
  - CODE_OF_CONDUCT.md
  # Other people's READMEs, held to other people's rules. Both of these are
  # gitignored, but a glob does not know that: node_modules is where the linters
  # themselves live, and .bun-cache is where CI puts bun's cache, because GitHub
  # can only cache paths inside the project directory.
  - "**/node_modules/**"
  - "**/.bun-cache/**"
  # Vale's style packages, downloaded by `vale sync`. Somebody else's docs,
  # held to somebody else's rules.
  - "styles/Google/**"
  - "styles/proselint/**"
  # OpenSpec's own Claude Code skills and commands, vendored by `openspec init`.
  - ".claude/**"

config:
  # A pull request template has no title of its own — GitHub drops it into a
  # body that already has one, so demanding a top-level heading here would mean
  # writing a heading that renders in the wrong place.
  MD041: false

  # The prettier style file drops MD013 on the assumption Prettier reflows
  # prose, which it only does with proseWrap "always" or "never" — this repo's
  # .prettierrc keeps "preserve", so the check is still ours and still worth
  # having. Re-enabled under the alias: `extends` merges on the literal key,
  # so an `MD013:` block here would sit beside the inherited `line-length:
  # false` and lose, reading as on while actually off.
  line-length:
    # Prose stays at 80 so the diff of a reworded paragraph is the paragraph.
    line_length: 80
    # Tables and code blocks are exempt: a pinned image digest and a table row
    # cannot be wrapped, and mangling them to satisfy a number reads worse.
    tables: false
    code_blocks: false
