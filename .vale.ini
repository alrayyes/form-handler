StylesPath = styles
MinAlertLevel = warning

# Downloaded by `vale sync`, not committed. The style folders they land in are
# gitignored by name; styles/House/ and the vocabulary are ours and are not.
Packages = Google, proselint

# Core options first — Vale refuses a Vocab set after a format section.
Vocab = House

[*.md]
BasedOnStyles = Vale, Google, proselint

# Holds the document to the spellings in the vocabulary — "Github", "NPM" and
# "javascript" get flagged where GitHub, npm and JavaScript are the accepted
# forms. Without it, accept.txt only silences the spell checker and any casing
# passes.
Vale.Terms = YES

# Off on purpose. This service's prose says "we" and "you"
# deliberately: the README is written to a person.
Google.We = NO
# First-person plural is the house voice here.
Google.FirstPerson = NO
# Contractions are how the prose reads out loud, which is the point.
Google.Contractions = NO
# Every heading in this repository is a sentence, not a title, and the rule
# fires on the product names in them rather than on the style.
Google.Headings = NO

# This repository writes spaced em dashes — like this — throughout, which is
# ordinary British typography and deliberate. Google's guide wants them closed
# up. Thirty findings that all say "we made a house choice" is how a style
# linter teaches people to stop reading it.
Google.EmDash = NO

# British punctuation: commas and full stops go outside the quotation marks
# unless they belong to the quoted text. Google's guide is American and wants
# them inside. The prose here is consistently British — "licence", "behaviour" —
# so this rule would be asking it to be half one thing and half the other.
Google.Quotes = NO
