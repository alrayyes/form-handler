# Same commands CI runs, so the two cannot drift.
pre-commit:
  commands:
    fmt:
      glob: "*.go"
      run: gofmt -l {staged_files} | (! grep .)
    lint:
      glob: "*.go"
      run: golangci-lint run ./...
    hadolint:
      glob: "Dockerfile"
      run: docker run --rm -i hadolint/hadolint:v2.14.0-alpine hadolint --failure-threshold warning - < Dockerfile
    markdown:
      glob: "*.md"
      run: bunx markdownlint-cli2 {staged_files}

commit-msg:
  commands:
    # Resolved from node_modules rather than fetched by bunx: commitlint has to
    # load the config its own config extends, and bunx cannot resolve a sibling
    # package for it. Run `bun install` if this cannot find itself.
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  commands:
    test:
      run: go test ./...
