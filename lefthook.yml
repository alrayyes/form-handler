# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.

# pre-commit may write. Let every fixer run and restage what it touched — a
# commit should not fail over a quote style a tool can settle by itself.
pre-commit:
  jobs:
    - name: gofmt
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true

    - name: golangci-lint
      glob: "*.go"
      # Same build tag CI uses, or the integration tests go unlinted here and
      # fail there instead.
      run: golangci-lint run --build-tags=integration ./...

    # Prettier decides the layout, markdownlint then judges what Prettier
    # produced. The other order has markdownlint fixing something Prettier is
    # about to overwrite.
    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 {staged_files}

    # Fast enough for a commit. LTeX is not — it ships its own Java runtime and
    # is a ~300 MB download — so mechanics are checked in CI and by the editor
    # over LSP, not here.
    - name: vale
      glob: "*.md"
      # The same two the CI job leaves out, and for the same reason: the
      # Contributor Covenant is somebody else's document and the changelog is
      # written by the release job. Both are prose nobody here composed, and
      # holding them to house style fails a commit over a `ci:` scope in a
      # generated line.
      #
      # Vale is the one linter whose exclusions cannot live in its own config,
      # so unlike Prettier and markdownlint it has to be told twice. When it
      # was only told once, correcting the changelog by hand was impossible.
      exclude:
        - "CODE_OF_CONDUCT.md"
        - "CHANGELOG.md"
      run: vale {staged_files}

    # Biome owns every file type it supports, which here is the JSON and
    # nothing else. It formats and lints in one pass, so this is both.
    - name: biome
      glob: "*.json"
      run: bunx biome check --write {staged_files}
      stage_fixed: true

    # Reads only, so it changes nothing to restage. Invoked bare rather than on
    # {staged_files}: what gets linted is the `apis` list in redocly.yaml, and
    # naming a path here is how the hook and CI end up checking different
    # files. The glob only decides whether it is worth running at all.
    - name: redocly
      # Wider than the one file this repository has today. `api/*.yaml` missed
      # a spec named .yml and missed one split across api/paths/, and a hook
      # that silently does not run is worse than no hook — the failure surfaces
      # at CI instead, after the push, which is the gap the hooks exist to
      # close.
      glob:
        - "api/*.yaml"
        - "api/*.yml"
        - "api/**/*.yaml"
        - "api/**/*.yml"
        - "redocly.yaml"
      run: bunx redocly lint

commit-msg:
  jobs:
    # Resolved from node_modules rather than fetched by bunx: commitlint has to
    # load the config its own config extends, and bunx cannot resolve a sibling
    # package for it. Run `bun install` if this cannot find itself.
    - name: commitlint
      run: bunx commitlint --edit {1}

# pre-push never writes. A hook rewriting files under a push leaves the pushed
# commit and the working tree disagreeing about what was reviewed.
pre-push:
  jobs:
    - name: test
      run: go test ./...

    # These are `package.json` scripts rather than the commands spelled out,
    # because CI runs the same ones and a literal copied into two files drifts
    # the first time somebody edits one of them.
    - name: prettier
      run: bun run format:check

    - name: markdownlint
      run: bun run lint:md

    - name: biome
      run: bun run lint:json

    - name: redocly
      run: bun run lint:api

    # The integration test is not here on purpose: it wants a Docker daemon and
    # takes the better part of a minute, which is more than a push should cost.
    # CI runs it on every branch.
