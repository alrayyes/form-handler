# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.

# pre-commit may write. Let every fixer run and restage what it touched — a
# commit should not fail over a quote style a tool can settle by itself.
pre-commit:
  jobs:
    # Through the pinned golang image (scripts/go-in-docker.sh), not the host
    # gofmt: a host toolchain can drift from what golangci-lint's own image
    # type-checks against, independently and silently.
    - name: gofmt
      glob: "*.go"
      run: ./scripts/go-in-docker.sh 'gofmt -w {staged_files}'
      stage_fixed: true

    # go.mod's own canonicalizer — gofmt never touches it. No check-only flag
    # exists for this half, so pre-push/CI re-run it and diff instead.
    - name: go-mod-fmt
      glob: "go.mod"
      run: ./scripts/go-in-docker.sh 'go mod edit -fmt go.mod'
      stage_fixed: true

    # Prettier decides the layout, markdownlint then judges what Prettier
    # produced. The other order has markdownlint fixing something Prettier is
    # about to overwrite.
    - name: prettier
      glob: "*.{md,yml,yaml}"
      exclude: ".claude/"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      exclude: ".claude/"
      run: bunx markdownlint-cli2 {staged_files}

    # Fast enough for a commit. LTeX is not — around eight seconds a file — so
    # mechanics run at push instead, where the wait is paid once rather than
    # per commit.
    - name: vale
      glob: "*.md"
      # The same two the CI job leaves out, and for the same reason: the
      # Contributor Covenant is somebody else's document and the changelog is
      # written by the release job. Both are prose nobody here composed, and
      # holding them to house style fails a commit over a `ci:` scope in a
      # generated line.
      #
      # Vale is the one linter whose exclusions cannot live in its own config,
      # so unlike Prettier and markdownlint it has to be told twice. When it
      # was only told once, correcting the changelog by hand was impossible.
      exclude:
        - "CODE_OF_CONDUCT.md"
        - "CHANGELOG.md"
      run: vale {staged_files}

    # Key order, not formatting — Biome leaves that alone. Runs first so
    # Biome is the one deciding the final layout, not the other way round.
    - name: sort-package-json
      glob: "package.json"
      run: bunx sort-package-json {staged_files}
      stage_fixed: true

    # Biome owns every file type it supports, which here is the JSON and
    # nothing else. It formats and lints in one pass, so this is both.
    - name: biome
      glob: "*.json"
      run: bunx biome check --write {staged_files}
      stage_fixed: true

    # Reads only, so it changes nothing to restage. Invoked bare rather than on
    # {staged_files}: what gets linted is the `apis` list in redocly.yaml, and
    # naming a path here is how the hook and CI end up checking different
    # files. The glob only decides whether it is worth running at all.
    - name: redocly
      # Wider than the one file this repository has today. `api/*.yaml` missed
      # a spec named .yml and missed one split across api/paths/, and a hook
      # that silently does not run is worse than no hook — the failure surfaces
      # at CI instead, after the push, which is the gap the hooks exist to
      # close.
      glob:
        - "api/*.yaml"
        - "api/*.yml"
        - "api/**/*.yaml"
        - "api/**/*.yml"
        - "redocly.yaml"
      run: bunx redocly lint

commit-msg:
  jobs:
    # Resolved from node_modules rather than fetched by bunx: commitlint has to
    # load the config its own config extends, and bunx cannot resolve a sibling
    # package for it. Run `bun install` if this cannot find itself.
    - name: commitlint
      run: bunx commitlint --edit {1}

# pre-push never writes. A hook rewriting files under a push leaves the pushed
# commit and the working tree disagreeing about what was reviewed.
#
# Parallel because of that: nothing here touches a file, so no job can be
# reading what another is rewriting, and the wait is the slowest job rather
# than the sum of all of them. Mechanics is most of it and the rest now runs
# underneath it for free.
pre-push:
  parallel: true
  jobs:
    - name: test
      run: ./scripts/go-in-docker.sh 'go test ./...'

    # Through golangci-lint's own pinned image (scripts/golangci-lint-in-docker.sh),
    # for the same reason gofmt runs through the golang image: a host
    # toolchain and a host golangci-lint update independently of each other.
    # Type-checks whole packages through go/packages, so scoping it to
    # staged files barely trims the run time — it costs the same whether
    # it's paid once a push or on every commit. It belongs here, not in
    # pre-commit, so that cost is paid once. Same build tags CI uses, or the
    # integration and container tests go unlinted here and fail there
    # instead.
    - name: golangci-lint
      run: ./scripts/golangci-lint-in-docker.sh 'golangci-lint run --build-tags=integration,containertest ./...'

    - name: govulncheck
      run: ./scripts/go-in-docker.sh 'go tool govulncheck ./...'

    # -mod=readonly only fails a build on a missing require — it says nothing
    # about a stale one tidy would remove, a non-canonical version string it
    # would rewrite, or a go.sum entry for a module nothing imports anymore.
    # -diff prints that drift and exits non-zero without touching the file.
    - name: go-mod-tidy
      run: ./scripts/go-in-docker.sh 'go mod tidy -diff'

    # Catches go.mod formatting drift that slipped past pre-commit — a commit
    # made with --no-verify, or go.mod edited by something other than a
    # staged commit.
    - name: go-mod-fmt
      run: ./scripts/go-in-docker.sh 'go mod edit -fmt go.mod && git diff --exit-code go.mod'

    # These are `package.json` scripts rather than the commands spelled out,
    # because CI runs the same ones and a literal copied into two files drifts
    # the first time somebody edits one of them.
    - name: prettier
      run: bun run format:check

    - name: markdownlint
      run: bun run lint:md

    - name: biome
      run: bun run lint:json

    - name: sort-package-json
      run: bun run lint:package-json

    - name: redocly
      run: bun run lint:api

    # Every other linter here runs at commit, at push and in CI. Vale ran at
    # commit and then nothing until CI, because its invocation lived in the
    # workflow as a block of bash with nothing a hook could reuse. It is a
    # script now, and this is the whole-tree run that was missing.
    - name: vale
      run: bun run lint:prose

    # Grammar and spelling. Left out of the hooks until now on the grounds that
    # it is a ~300 MB download, which it is — but it caches outside the
    # repository and then costs about ten seconds. Running it only in CI meant
    # finding out about a misspelt product name a pipeline at a time.
    - name: mechanics
      run: bun run lint:mechanics

    # The integration and container tests are not here on purpose: both want a
    # Docker daemon, the container test wants ko as well, and either takes the
    # better part of a minute, which is more than a push should cost. CI runs
    # them on every branch.
