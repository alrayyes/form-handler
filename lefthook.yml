# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.

# pre-commit may write. Let every fixer run and restage what it touched — a
# commit should not fail over a quote style a tool can settle by itself.
pre-commit:
  jobs:
    - name: gofmt
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true

    - name: golangci-lint
      glob: "*.go"
      # Same build tag CI uses, or the integration tests go unlinted here and
      # fail there instead.
      run: golangci-lint run --build-tags=integration ./...

    # Prettier decides the layout, markdownlint then judges what Prettier
    # produced. The other order has markdownlint fixing something Prettier is
    # about to overwrite.
    - name: prettier
      glob: "*.md"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 {staged_files}

    # Fast enough for a commit. LTeX is not — it ships its own Java runtime and
    # is a ~300 MB download — so mechanics are checked in CI and by the editor
    # over LSP, not here.
    - name: vale
      glob: "*.md"
      run: vale {staged_files}

    # Biome owns every file type it supports, which here is the JSON and
    # nothing else. It formats and lints in one pass, so this is both.
    - name: biome
      glob: "*.json"
      run: bunx biome check --write {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    # Resolved from node_modules rather than fetched by bunx: commitlint has to
    # load the config its own config extends, and bunx cannot resolve a sibling
    # package for it. Run `bun install` if this cannot find itself.
    - name: commitlint
      run: bunx commitlint --edit {1}

# pre-push never writes. A hook rewriting files under a push leaves the pushed
# commit and the working tree disagreeing about what was reviewed.
pre-push:
  jobs:
    - name: test
      run: go test ./...

    - name: prettier
      run: bunx prettier --check "**/*.md"

    - name: markdownlint
      run: bunx markdownlint-cli2

    - name: biome
      run: bunx biome check .

    # The integration test is not here on purpose: it wants a Docker daemon and
    # takes the better part of a minute, which is more than a push should cost.
    # CI runs it on every branch.
